services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --no-input && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment: &backend-env
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - dbdata:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A credo worker -c 4 -l info
    environment: *backend-env
    volumes:
      - dbdata:/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # The browser (not the container) calls the API, so use the host-mapped port.
      VITE_API_BASE: http://localhost:8000/api
    depends_on:
      backend:
        condition: service_started

volumes:
  dbdata:
